<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nado Pang</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#151923;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:min(100%,800px);padding:12px;text-align:center}
h1{font-size:22px;margin:4px 0 10px}
#game-wrap{width:100%;position:relative}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;background:#202b3b;border:2px solid #697386;border-radius:10px;touch-action:none}
#controls{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px;margin-top:12px}
button{min-height:58px;border:0;border-radius:14px;background:#35445d;color:white;font-size:20px;font-weight:700;touch-action:none}
button:active{background:#526b91;transform:scale(.98)}
#hint{font-size:13px;color:#c5ccda;margin:10px 0 0}
@media (min-width:650px){#controls{max-width:500px;margin:12px auto 0}}
</style>
</head>
<body>
<main id="app">
<h1>Nado Pang</h1>
<div id="game-wrap"><canvas id="game" width="640" height="480" aria-label="Nado Pang 게임"></canvas></div>
<div id="controls">
<button id="left" aria-label="왼쪽 이동">◀ 왼쪽</button>
<button id="right" aria-label="오른쪽 이동">오른쪽 ▶</button>
<button id="fire" aria-label="무기 발사">발사 ●</button>
</div>
<p id="hint">PC: 방향키로 이동, 스페이스바로 발사 · 모바일: 아래 버튼을 누르세요</p>
</main>
<script>
(() => {
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const W=640,H=480, TOTAL=60;
const names=['background.png','stage.png','character.png','weapon.png','balloon1.png','balloon2.png','balloon3.png','balloon4.png'];
const imgs={};
let loaded=0, loadFailed=false;
names.forEach(n=>{const im=new Image(); im.onload=()=>{loaded++;}; im.onerror=()=>{loadFailed=true;}; im.src='images/'+n; imgs[n]=im;});
let keys={left:false,right:false}, characterX=0, weapons=[], balls=[], startTime=0, state='loading', result='';
let charW=50,charH=60,stageH=40, weaponW=12,weaponH=28;
const speedY=[-11.4,-9.5,-7.6,-5.7];
const getSize=(im,fw,fh)=>im&&im.complete&&im.naturalWidth?{w:im.naturalWidth,h:im.naturalHeight}:{w:fw,h:fh};
function reset(){
 const cs=getSize(imgs['character.png'],50,60), ss=getSize(imgs['stage.png'],640,40);
 charW=cs.w;charH=cs.h;stageH=ss.h;
 characterX=(W-charW)/2; weapons=[];
balls=[{x:50,y:50,idx:0,vx:2.8,vy:-5.7,init:speedY[0]}];
startTime=performance.now();state='playing';result='';
}
function fire(){if(state!=='playing')return;weapons.push({x:characterX+charW/2-weaponW/2,y:H-charH-stageH});}
function bindHold(id,key){const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});
 const stop=e=>{keys[key]=false}; b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop);
}
bindHold('left','left');bindHold('right','right');
const fireBtn=document.getElementById('fire');
fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();fire()});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 if(e.code==='ArrowLeft')keys.left=true;if(e.code==='ArrowRight')keys.right=true;if(e.code==='Space'&&!e.repeat)fire();
 if((e.code==='Enter'||e.code==='NumpadEnter')&&state!=='playing')reset();
});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false;});
function drawImage(name,x,y,w,h, fallback, color='#fff'){
 const im=imgs[name];if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,x,y,w??im.naturalWidth,h??im.naturalHeight);
 else {ctx.fillStyle=color;ctx.fillRect(x,y,w||40,h||40);if(fallback){ctx.fillStyle='#111';ctx.font='12px sans-serif';ctx.fillText(fallback,x+3,y+16);}}
}
function finish(text){result=text;state='over';}
function update(){
 if(state!=='playing')return;
 const elapsed=(performance.now()-startTime)/1000;
 if(elapsed>=TOTAL){finish('Time Over');return;}
 if(keys.left)characterX-=2;if(keys.right)characterX+=2;
 characterX=Math.max(0,Math.min(W-charW,characterX));
 weapons.forEach(w=>w.y-=6);weapons=weapons.filter(w=>w.y>0);
 const floor=H-stageH;
 balls.forEach(b=>{
  const size=getSize(imgs['balloon'+(b.idx+1)+'.png'],70,70);
  if(b.x<0||b.x>W-size.w)b.vx*=-1;
  if(b.y>=floor-size.h)b.vy=b.init;else b.vy+=.226;
  b.x+=b.vx;b.y+=b.vy;
 });
 let removeBall=-1,removeWeapon=-1, additions=[];
 for(let bi=0;bi<balls.length;bi++){
  const b=balls[bi], bs=getSize(imgs['balloon'+(b.idx+1)+'.png'],70,70);
  for(let wi=0;wi<weapons.length;wi++){
   const w=weapons[wi];
   if(w.x< b.x+bs.w && w.x+weaponW>b.x && w.y<b.y+bs.h && w.y+weaponH>b.y){
    removeBall=bi;removeWeapon=wi;
    if(b.idx<3){
     const small=getSize(imgs['balloon'+(b.idx+2)+'.png'],50,50);
     const x=b.x+bs.w/2-small.w/2,y=b.y+bs.h/2-small.h/2;
    additions.push({x,y,idx:b.idx+1,vx:-2.8,vy:-5.7,init:speedY[b.idx+1]},{x,y,idx:b.idx+1,vx:2.8,vy:-5.7,init:speedY[b.idx+1]});    }
    break;
   }
  }
  if(removeBall!==-1)break;
 }
 if(removeBall>-1){balls.splice(removeBall,1);weapons.splice(removeWeapon,1);balls.push(...additions);}
 const cx=characterX,cy=H-charH-stageH;
 for(const b of balls){const bs=getSize(imgs['balloon'+(b.idx+1)+'.png'],70,70);
  if(cx<b.x+bs.w&&cx+charW>b.x&&cy<b.y+bs.h&&cy+charH>b.y){finish('Game Over');break;}
 }
 if(!balls.length)finish('Mission Complete');
}
function render(){
 ctx.clearRect(0,0,W,H);
 drawImage('background.png',0,0,W,H,'배경','#27364a');
 drawImage('stage.png',0,H-stageH,W,stageH,'발판','#7c8798');
 weapons.forEach(w=>drawImage('weapon.png',w.x,w.y,weaponW,weaponH,'','#ffe27a'));
 balls.forEach(b=>{const s=getSize(imgs['balloon'+(b.idx+1)+'.png'],70,70);drawImage('balloon'+(b.idx+1)+'.png',b.x,b.y,s.w,s.h,'공','#f39b75')});
 drawImage('character.png',characterX,H-charH-stageH,charW,charH,'캐릭터','#79c7ff');
 if(state==='playing'){const remain=Math.max(0,Math.ceil(TOTAL-(performance.now()-startTime)/1000));ctx.fillStyle='white';ctx.font='28px sans-serif';ctx.fillText('Time : '+remain,10,32);}
 if(state==='loading'&&loaded<names.length&&!loadFailed){ctx.fillStyle='white';ctx.font='22px sans-serif';ctx.fillText('이미지 불러오는 중...',210,240);}
 if(state==='over'||state==='loading'&&loadFailed){
  ctx.fillStyle='rgba(0,0,0,.68)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='white';ctx.font='bold 34px sans-serif';
  ctx.fillText(state==='over'?result:'이미지를 찾을 수 없습니다',W/2,H/2-12);
  ctx.font='20px sans-serif';ctx.fillText(state==='over'?'화면을 누르거나 Enter를 눌러 다시 시작':'images 폴더에 PNG 파일 8개를 넣어 주세요',W/2,H/2+30);ctx.textAlign='left';
 }
}
canvas.addEventListener('pointerdown',()=>{if(state==='over')reset()});
function loop(){if(state==='loading'&&loaded===names.length)reset();update();render();requestAnimationFrame(loop)}
loop();
})();
</script>
</body>
</html>
